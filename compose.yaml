x-python: &python
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - ./backend/.env
  environment:
    REDIS_URL: redis://redis:6379/0
    JOB_DATA_DIR: /app/job-data
  volumes:
    - backend_instance:/app/backend/src/instance
    - job_data:/app/job-data
    - ./config:/app/config:ro
  depends_on:
    redis:
      condition: service_healthy

services:
  backend:
    <<: *python
    command: ["gunicorn", "--worker-class", "gthread", "--workers", "2", "--threads", "8", "--bind", "0.0.0.0:8000", "wsgi:app"]

  worker:
    <<: *python
    command: ["rq", "worker", "--worker-class", "vulniverse_api.jobs.worker.NotifyingWorker", "--url", "redis://redis:6379/0", "patch2vuln"]
    stop_grace_period: 35m
    volumes:
      - backend_instance:/app/backend/src/instance
      - job_data:/app/job-data
      - ./config:/app/config:ro
      - ${PATCH2VULN_HOST_DIR}:/opt/patch2vuln:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    depends_on:
      - backend

volumes:
  backend_instance:
  job_data:
  redis_data:
