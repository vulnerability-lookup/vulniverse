[project]
name = "vulniverse-api"
version = "0.1.0"
description = ""
authors = [
    {name = "NMD03",email = "nicjan01@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "flask-migrate (>=4.1.0,<5.0.0)",
    "jsonschema (>=4.26.0,<5.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "types-jsonschema>=4.26.0.20260518",
    "types-flask-migrate>=4.1.0.20260508",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vulniverse_api"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
