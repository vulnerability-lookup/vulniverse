# Example nginx site config for Vulniverse — serves the built frontend
# and reverse-proxies the API to gunicorn. See docs/setup/production.md
# for the full walkthrough. Copy this to
# /etc/nginx/sites-available/vulniverse, adjust the paths/domain below,
# then:
#
#   sudo ln -s /etc/nginx/sites-available/vulniverse /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx

server {
    listen 80;
    server_name vulniverse.example.org;

    # Output of `npm run build` (frontend/dist) — see docs/setup/setup.md.
    root /opt/vulniverse/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue Router history mode — unmatched paths fall back to index.html
    # so client-side routes (e.g. /records/123) work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
