name: CI

# Verifies both halves of the project on every push to main and on every
# pull request: lint, type-check, and test. Separate from
# build-element.yml, which builds (and, on tags, publishes) the
# embeddable <vulniverse-editor> bundle specifically — a release-artifact
# concern, not a correctness gate.

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy .

      - name: pytest
        run: uv run pytest -q

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      # No frontend unit-test step yet
