name: Build embeddable editor

# Builds the standalone <vulniverse-editor> custom element bundle
# (frontend/dist/element/vulniverse-editor.js — see
# frontend/vite.element.config.ts and CLAUDE.md's "Frontend
# architecture" section) and publishes it as a downloadable GitHub
# release asset:
#
#   - Every push to main updates a rolling "nightly" pre-release
#     with the freshest build:
#     https://github.com/<owner>/<repo>/releases/download/nightly/vulniverse-editor.js
#   - Pushing a version tag (v*.*.*) publishes a proper, permanent
#     release for that version, which GitHub's own "latest release"
#     alias also resolves to:
#     https://github.com/<owner>/<repo>/releases/latest/download/vulniverse-editor.js
#
#   - The same version tag also publishes the npm package in
#     packages/editor (see the "npm" job below); a pre-release
#     (v1.0.0-rc.1) goes to its own npm dist-tag (rc) instead of
#     "latest". A tag whose version isn't set everywhere (see
#     scripts/set_version.py) fails before anything is published.
#
# Pull requests and other branches only build, to catch breakage
# before merge, without publishing anything.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "frontend/**"
      - ".github/workflows/build-element.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/build-element.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Set with `python3 scripts/set_version.py <version>` before tagging.
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/set_version.py --check "$GITHUB_REF_NAME"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the embeddable element
        working-directory: frontend
        run: npm run build:element

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: vulniverse-editor
          path: |
            frontend/dist/element/vulniverse-editor.js
            frontend/dist/element/vulniverse-editor.js.map
            frontend/dist/element/vulniverse-editor.d.ts
          if-no-files-found: error

      - name: Publish rolling nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: >-
            Automatically rebuilt from the latest commit on `main`
            (${{ github.sha }}). Not a versioned release — for a
            stable, pinned version, use a tagged release instead.
          files: frontend/dist/element/vulniverse-editor.js

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: frontend/dist/element/vulniverse-editor.js

  # Publishes packages/editor to npm with provenance. Authentication:
  # npm trusted publishing (register this repository and this workflow
  # file on the package's npm settings page; no secret needed), or an
  # NPM_TOKEN repository secret as a fallback.
  npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@11

      - name: Get the built bundle
        uses: actions/download-artifact@v7
        with:
          name: vulniverse-editor
          path: packages/editor/dist

      - name: Publish to npm
        working-directory: packages/editor
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # 1.0.0-rc.1 -> "rc", 0.1.0-alpha.3 -> "alpha", 1.0.0 -> "latest".
          if [[ "$version" == *-* ]]; then
            prerelease="${version#*-}"
            tag="${prerelease%%.*}"
          else
            tag="latest"
          fi
          npm publish --provenance --access public --tag "$tag"
